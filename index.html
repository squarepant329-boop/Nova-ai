<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiDrop - Like Xender</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
  body{font-family:'Space Grotesk', sans-serif}
 .glass{backdrop-filter:blur(16px); background:rgba(255,255,255,0.08)}
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-5xl grid md:grid-cols-2 gap-6">

  <!-- LEFT: INFO & PEER ID -->
  <div class="bg-[#151515] rounded-[32px] p-8 border border-white/10">
    <h1 class="text-4xl font-bold">WiDrop<span class="text-[#7CFF6B]">.</span></h1>
    <p class="text-white/60 mt-2">Fast file transfer over WiFi. Like Xender, but in your browser.</p>

    <div class="mt-8 p-5 rounded-2xl bg-white/[0.05] border border-white/10">
      <p class="text-xs tracking-widest text-white/40">YOUR ID</p>
      <p id="myId" class="text-2xl font-bold mt-1 tracking-wider">Connecting...</p>
      <div id="qrcode" class="mt-4 bg-white p-3 rounded-xl w-fit"></div>
      <p class="text-[11px] text-white/40 mt-3">Both devices must be on same WiFi/Hotspot</p>
    </div>

    <div class="mt-6">
      <label class="text-xs text-white/40">CONNECT TO FRIEND ID</label>
      <div class="flex gap-2 mt-2">
        <input id="peerIdInput" placeholder="Enter friend's ID" class="flex-1 bg-white/5 border border-white/10 rounded-full px-5 py-3 outline-none focus:border-[#7CFF6B]">
        <button onclick="connectToPeer()" class="bg-[#7CFF6B] text-black font-bold px-7 rounded-full hover:bg-white transition">CONNECT</button>
      </div>
      <p id="status" class="text-sm mt-3 text-[#7CFF6B]">● Waiting for connection...</p>
    </div>
  </div>

  <!-- RIGHT: FILE TRANSFER -->
  <div class="bg-[#151515] rounded-[32px] p-8 border border-white/10 flex flex-col">
    <div class="flex justify-between items-center">
      <h2 class="text-xl font-bold">Transfer</h2>
      <span id="connStatus" class="text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded-full">Not Connected</span>
    </div>

    <div id="dropZone" class="mt-6 border-2 border-dashed border-white/10 rounded-[24px] h-48 flex flex-col items-center justify-center hover:border-[#7CFF6B]/50 transition cursor-pointer">
      <div class="text-4xl">📦</div>
      <p class="mt-2 font-bold">Drop files here or click</p>
      <p class="text-xs text-white/40">Any file, any size</p>
      <input type="file" id="fileInput" multiple hidden>
    </div>

    <div id="fileList" class="mt-6 space-y-3 max-h-[300px] overflow-auto pr-1"></div>

    <button id="sendBtn" disabled class="mt-auto w-full bg-white/10 text-white/30 font-bold py-4 rounded-full cursor-not-allowed">Select files to send</button>
  </div>

</div>

<script>
let peer, conn, myPeerId;
const chunkSize = 64 * 1024;
let incomingFiles = {};

// 1. CREATE PEER
peer = new Peer(Math.floor(100000 + Math.random()*900000).toString());
peer.on('open', id => {
  myPeerId = id;
  document.getElementById('myId').innerText = id;
  new QRCode(document.getElementById("qrcode"), {text: id, width: 120, height: 120});
});
peer.on('connection', c => setupConnection(c));

// 2. CONNECT TO OTHER PEER
function connectToPeer(){
  const id = document.getElementById('peerIdInput').value.trim();
  if(!id) return alert('Enter ID');
  const c = peer.connect(id, {reliable: true});
  setupConnection(c);
}

function setupConnection(c){
  conn = c;
  document.getElementById('connStatus').innerText = 'Connected';
  document.getElementById('connStatus').className = 'text-xs bg-[#7CFF6B]/20 text-[#7CFF6B] px-3 py-1 rounded-full';
  document.getElementById('status').innerText = '● Connected to ' + c.peer;
  conn.on('data', handleData);
  conn.on('close', ()=>{ document.getElementById('connStatus').innerText='Disconnected'; });
  enableSend();
}

function enableSend(){
  const btn = document.getElementById('sendBtn');
  btn.disabled = false;
  btn.className = 'mt-auto w-full bg-[#7CFF6B] text-black font-bold py-4 rounded-full hover:bg-white transition';
  btn.innerText = 'Send Files';
  btn.onclick = sendFiles;
}

// 3. UI - DRAG & DROP
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => {e.preventDefault(); dropZone.classList.add('bg-white/5')};
dropZone.ondragleave = () => dropZone.classList.remove('bg-white/5');
dropZone.ondrop = e => {e.preventDefault(); dropZone.classList.remove('bg-white/5'); handleFiles(e.dataTransfer.files)};
fileInput.onchange = () => handleFiles(fileInput.files);

let filesToSend = [];
function handleFiles(files){
  filesToSend = [...files];
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  filesToSend.forEach(f=>{
    list.innerHTML += `<div class="flex justify-between p-3 rounded-xl bg-white/5 border border-white/5"><span class="truncate">${f.name}</span><span class="text-white/40 text-xs">${(f.size/1024/1024).toFixed(2)} MB</span></div>`;
  });
  if(conn) enableSend();
}

// 4. SEND LOGIC - CHUNKED
async function sendFiles(){
  for(const file of filesToSend){
    const id = Date.now()+Math.random();
    conn.send({type:'meta', id, name:file.name, size:file.size, mime:file.type});
    let offset = 0;
    while(offset < file.size){
      const chunk = file.slice(offset, offset+chunkSize);
      const buf = await chunk.arrayBuffer();
      conn.send({type:'chunk', id, data: buf});
      offset += chunkSize;
      const pct = Math.floor((offset/file.size)*100);
      document.getElementById('status').innerText = `Sending ${file.name} - ${pct}%`;
    }
    conn.send({type:'end', id});
  }
}

// 5. RECEIVE LOGIC
function handleData(msg){
  if(msg.type === 'meta'){
    incomingFiles[msg.id] = {name: msg.name, size: msg.size, mime: msg.mime, buffers: [], received:0};
    const list = document.getElementById('fileList');
    list.innerHTML += `<div id="f-${msg.id}" class="p-3 rounded-xl bg-[#7CFF6B]/10 border border-[#7CFF6B]/20"><div class="flex justify-between"><span>${msg.name}</span><span id="p-${msg.id}" class="text-[#7CFF6B]">0%</span></div><div class="w-full h-1 bg-white/10 mt-2 rounded-full"><div id="bar-${msg.id}" class="h-1 bg-[#7CFF6B] rounded-full" style="width:0%"></div></div></div>`;
  }
  if(msg.type === 'chunk'){
    const f = incomingFiles[msg.id];
    f.buffers.push(msg.data);
    f.received += msg.data.byteLength;
    const pct = Math.floor((f.received/f.size)*100);
    document.getElementById(`p-${msg.id}`).innerText = pct+'%';
    document.getElementById(`bar-${msg.id}`).style.width = pct+'%';
  }
  if(msg.type === 'end'){
    const f = incomingFiles[msg.id];
    const blob = new Blob(f.buffers, {type: f.mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = f.name; a.click();
    document.getElementById(`p-${msg.id}`).innerText = 'Done ✓';
  }
}
</script>
</body>
</html>
