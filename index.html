<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #10172a, #1c2a4a);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #172238;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        /* Header */

        .header {
            background: #202f4d;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #34425f;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: bold;
        }

        .header h2 {
            font-size: 20px;
        }

        .header p {
            font-size: 12px;
            color: #9eabc7;
            margin-top: 4px;
        }

        .online {
            color: #00ff99;
        }

        /* Chat area */

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 13px 16px;
            border-radius: 15px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
        }

        .bot {
            align-self: flex-start;
            background: #283954;
            border-bottom-left-radius: 4px;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #635bff, #4285ff);
            border-bottom-right-radius: 4px;
        }

        .welcome {
            text-align: center;
            margin: 20px 0;
        }

        .welcome h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #aab6d0;
            font-size: 14px;
        }

        /* Input area */

        .input-area {
            padding: 15px;
            background: #202f4d;
            display: flex;
            gap: 10px;
            border-top: 1px solid #34425f;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 25px;
            background: #111c32;
            color: white;
            font-size: 14px;
        }

        input::placeholder {
            color: #8b99b5;
        }

        button {
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #635bff, #00bfff);
            color: white;
            font-size: 20px;
        }

        .send-btn:hover {
            transform: scale(1.08);
        }

        .typing {
            color: #9eabc7;
            font-size: 13px;
            font-style: italic;
            margin-left: 5px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #7786a5;
            padding: 8px;
        }

        @media(max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->

    <div class="header">

        <div class="logo">N</div>

        <div>
            <h2>Nova AI</h2>
            <p><span class="online">●</span> Online Assistant</p>
        </div>

    </div>

    <!-- Chat Messages -->

    <div class="chat-box" id="chatBox">

        <div class="welcome">
            <h1>Hello! 👋</h1>
            <p>I'm Nova AI. Ask me anything!</p>
        </div>

        <div class="message bot">
            Hi there! I'm Nova AI. I can answer questions,
            explain concepts, solve simple maths problems,
            and chat with you. What would you like to know?
        </div>

    </div>

    <!-- Input -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            autocomplete="off"
        >

        <button class="send-btn" onclick="sendMessage()">
            ➤
        </button>

    </div>

    <div class="footer">
        Nova AI • Your intelligent chat companion
    </div>

</div>

<script>

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    // Add a message to the chat

    function addMessage(message, sender) {

        const messageDiv = document.createElement("div");

        messageDiv.className = "message " + sender;

        // Safely display user and bot text
        messageDiv.textContent = message;

        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
    }


    // Generate chatbot responses

    function getResponse(question) {

        let q = question.toLowerCase().trim();

        // Greetings

        if (
            q.includes("hello") ||
            q.includes("hi") ||
            q.includes("hey")
        ) {
            return "Hello! 😊 How can I help you today?";
        }

        // Name

        if (q.includes("your name")) {
            return "My name is Nova AI. I'm your virtual assistant!";
        }

        // How are you?

        if (q.includes("how are you")) {
            return "I'm doing great! Thanks for asking. How are you?";
        }

        // Time

        if (q.includes("time")) {
            return "The current time is " +
                new Date().toLocaleTimeString();
        }

        // Date

        if (q.includes("date") || q.includes("today")) {
            return "Today's date is " +
                new Date().toDateString();
        }

        // Mathematics

        if (
            q.includes("calculate") ||
            q.includes("what is") ||
            q.includes("solve")
        ) {

            let math = q.match(
                /(-?\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(-?\d+(?:\.\d+)?)/
            );

            if (math) {

                let num1 = Number(math[1]);
                let operator = math[2];
                let num2 = Number(math[3]);

                let result;

                switch (operator) {

                    case "+":
                        result = num1 + num2;
                        break;

                    case "-":
                        result = num1 - num2;
                        break;

                    case "*":
                        result = num1 * num2;
                        break;

                    case "/":
                        result = num2 !== 0
                            ? num1 / num2
                            : "Cannot divide by zero";
                        break;
                }

                return "The answer is " + result;
            }
        }

        // Capital of countries

        if (q.includes("capital of nigeria")) {
            return "The capital of Nigeria is Abuja.";
        }

        if (q.includes("capital of ghana")) {
            return "The capital of Ghana is Accra.";
        }

        if (q.includes("capital of usa")) {
            return "The capital of the United States is Washington, D.C.";
        }

        if (q.includes("capital of france")) {
            return "The capital of France is Paris.";
        }

        // Science

        if (q.includes("what is ai")) {
            return "AI means Artificial Intelligence. It is technology " +
                   "that allows computers to perform tasks such as " +
                   "understanding language, recognizing patterns, and solving problems.";
        }

        if (q.includes("what is html")) {
            return "HTML stands for HyperText Markup Language. " +
                   "It is used to structure webpages.";
        }

        if (q.includes("what is javascript")) {
            return "JavaScript is a programming language used to make " +
                   "websites interactive and dynamic.";
        }

        if (q.includes("what is css")) {
            return "CSS stands for Cascading Style Sheets. " +
                   "It controls the appearance and design of webpages.";
        }

        // Jokes

        if (q.includes("joke")) {

            const jokes = [
                "Why did the computer go to the doctor? " +
                "Because it had a virus! 😂",

                "Why was the math book sad? " +
                "Because it had too many problems! 😂",

                "Why do programmers prefer dark mode? " +
                "Because light attracts bugs! 🐛",

                "What do you call a fake noodle? " +
                "An impasta! 😂"
            ];

            return jokes[
                Math.floor(Math.random() * jokes.length)
            ];
        }

        // Compliments

        if (q.includes("thank")) {
            return "You're very welcome! 😊 I'm happy to help.";
        }

        // Goodbye

        if (
            q.includes("bye") ||
            q.includes("goodbye")
        ) {
            return "Goodbye! 👋 Come back anytime.";
        }

        // Random intelligent-style responses

        const responses = [

            "That's an interesting question! " +
            "Could you tell me a little more about what you mean?",

            "I'd love to help you with that. " +
            "Can you provide some additional details?",

            "Interesting! Let's explore that topic together. " +
            "What would you like to know specifically?",

            "I understand your question. " +
            "Could you explain it in another way so I can assist you better?",

            "That's something worth exploring! " +
            "Can you give me more information?",

            "I'm here to help! " +
            "Could you make your question a little more specific?"
        ];

        return responses[
            Math.floor(Math.random() * responses.length)
        ];
    }


    // Send message

    function sendMessage() {

        let question = userInput.value.trim();

        if (question === "") {
            return;
        }

        // Display user message

        addMessage(question, "user");

        userInput.value = "";

        // Show typing indicator

        const typing = document.createElement("div");

        typing.className = "typing";

        typing.textContent = "Nova AI is thinking...";

        chatBox.appendChild(typing);

        chatBox.scrollTop = chatBox.scrollHeight;

        // Generate response

        setTimeout(() => {

            typing.remove();

            let response = getResponse(question);

            addMessage(response, "bot");

        }, 1000);

    }


    // Enter key support

    userInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
  </html>
